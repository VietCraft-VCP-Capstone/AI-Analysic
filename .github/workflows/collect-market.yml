name: collect market data

# Dữ liệu thị trường cho Seasonal (F38): catalog Tiki + Etsy + Printify + VietCraft hằng ngày,
# và làm mới lịch sử Google Trends theo tuần + truy vấn đang tăng mỗi tuần.
# Chạy trên GitHub Actions để không phụ thuộc tiến trình scheduler trên VPS.

on:
  schedule:
    - cron: "30 20 * * *"     # 03:30 VN hằng ngày
    - cron: "0 21 * * 1"      # 04:00 VN thứ Ba: Trends theo tuần + truy vấn liên quan
  workflow_dispatch:
    inputs:
      job:
        description: "catalog | trends-weekly | all"
        default: all

concurrency:
  group: collect-market
  cancel-in-progress: false

jobs:
  catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'trends-weekly' || github.event.schedule == '30 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/collectors/requirements.txt
      - run: pip install -r app/collectors/requirements.txt
      - name: Collect external market products
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: data-collection
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python -m app.collectors.collect_external_products

  trends-weekly:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'catalog' || github.event.schedule == '0 21 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/collectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/collectors/requirements.txt
      - run: pip install -r requirements.txt
      - name: Refresh weekly history and rising queries
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: data-collection
        run: python collect_trends.py --backfill weekly --related --mongo
      - name: Pipeline health
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: data-collection
        run: python collect_trends.py --mongo-health
