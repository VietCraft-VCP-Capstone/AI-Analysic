name: collect trends

on:
  schedule:
    - cron: "0 22 * * *"      # 05:00 VN
    - cron: "0 10 * * *"      # 17:00 VN
  workflow_dispatch:

concurrency:
  group: collect-trends
  cancel-in-progress: false

env:
  MONGODB_DB: data-collection
  DATA_DIR: app/collectors

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ env.DATA_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.DATA_DIR }}/requirements.txt

      - run: pip install -r requirements.txt

      - name: Collect daily trends
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python collect_trends.py --daily --mongo

      - name: Pipeline health
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python collect_trends.py --mongo-health
          python verify_data.py --quality